<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ОГЭ-тренажёр</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="study.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="studio-page auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">ОГЭ-тренажёр</h1>
      <form id="auth-form" class="auth-form">
        <label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Пароль<div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Не менее 6 символов"><button class="password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false">👁</button></div></label>
        <label id="confirm-label" hidden>Повторите пароль<div class="password-field"><input id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Повторите пароль"><button class="password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false">👁</button></div></label>
        <fieldset class="auth-acceptances" id="legal-acceptances" hidden>
          <label class="auth-checkbox"><input name="personal-data-consent" type="checkbox" required disabled><span>Я даю <a href="./legal/consent.html" target="_blank" rel="noopener">согласие на обработку персональных данных</a>.</span></label>
          <label class="auth-checkbox"><input name="trainer-terms" type="checkbox" required disabled><span>Я принимаю <a href="./legal/terms.html" target="_blank" rel="noopener">Правила использования тренажёра</a>.</span></label>
        </fieldset>
        <button class="auth-submit" id="auth-submit" type="submit">Войти</button>
        <p id="auth-message" class="auth-message" role="status"></p>
        <div class="auth-help-actions">
          <button class="auth-help-button" id="forgot-password" type="button">Забыли пароль?</button>
          <button class="auth-help-button" id="resend-confirmation" type="button" hidden>Отправить письмо ещё раз</button>
        </div>
      </form>
      <button class="auth-mode-toggle" id="mode-toggle" type="button">Зарегистрироваться</button>
    </section>
  </main>
  <script src="./supabase-config.js"></script>
  <script src="/study/vendor/supabase-js-2.115.0/supabase.js"></script>
  <script>
    (() => {
      const form = document.querySelector('#auth-form');
      const message = document.querySelector('#auth-message');
      const submit = document.querySelector('#auth-submit');
      const modeToggle = document.querySelector('#mode-toggle');
      const confirmLabel = document.querySelector('#confirm-label');
      const confirmInput = document.querySelector('#password-confirm');
      const legalAcceptances = document.querySelector('#legal-acceptances');
      const acceptanceInputs = legalAcceptances.querySelectorAll('input[type="checkbox"]');
      const emailInput = form.elements.email;
      const forgotPassword = document.querySelector('#forgot-password');
      const resendConfirmation = document.querySelector('#resend-confirmation');
      const client = window.supabase.createClient(window.OGE_SUPABASE.url, window.OGE_SUPABASE.publishableKey);
      let registerMode = false;
      const recoveryRedirect = new URL('./reset-password.html', window.location.href).href;
      const confirmationRedirect = new URL('./index.html', window.location.href).href;
      const setMessage = (text, isError = false) => {
        message.textContent = text;
        message.className = `auth-message${isError ? ' is-error' : ''}`;
      };
      const currentEmail = () => String(emailInput.value || '').trim().toLowerCase();
      const requireEmail = () => {
        const email = currentEmail();
        if (email && emailInput.checkValidity()) return email;
        setMessage('Сначала укажите правильный email.', true);
        emailInput.focus();
        return '';
      };
      const updateSubmitState = () => {
        submit.disabled = registerMode && !Array.from(acceptanceInputs).every((input) => input.checked);
      };
      acceptanceInputs.forEach((input) => input.addEventListener('change', updateSubmitState));
      form.addEventListener('reset', () => setTimeout(updateSubmitState, 0));
      modeToggle.addEventListener('click', () => {
        registerMode = !registerMode;
        confirmLabel.hidden = !registerMode;
        confirmInput.required = registerMode;
        legalAcceptances.hidden = !registerMode;
        acceptanceInputs.forEach((input) => { input.disabled = !registerMode; });
        submit.textContent = registerMode ? 'Зарегистрироваться' : 'Войти';
        modeToggle.textContent = registerMode ? 'Уже есть аккаунт? Войти' : 'Зарегистрироваться';
        forgotPassword.hidden = registerMode;
        resendConfirmation.hidden = true;
        setMessage('');
        updateSubmitState();
      });
      document.querySelectorAll('.password-toggle').forEach((toggle) => toggle.addEventListener('click', () => {
        const input = toggle.previousElementSibling;
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        toggle.setAttribute('aria-pressed', String(!visible));
        toggle.setAttribute('aria-label', visible ? 'Показать пароль' : 'Скрыть пароль');
      }));
      forgotPassword.addEventListener('click', async () => {
        const email = requireEmail();
        if (!email) return;
        setMessage('Отправляем письмо для смены пароля…');
        const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: recoveryRedirect });
        setMessage(error ? 'Не удалось отправить письмо. Попробуйте ещё раз позднее.' : 'Письмо отправлено. Откройте ссылку из письма и задайте новый пароль.', Boolean(error));
      });
      resendConfirmation.addEventListener('click', async () => {
        const email = requireEmail();
        if (!email) return;
        setMessage('Отправляем письмо ещё раз…');
        const { error } = await client.auth.resend({ type: 'signup', email, options: { emailRedirectTo: confirmationRedirect } });
        setMessage(error ? 'Не удалось отправить письмо. Попробуйте ещё раз позднее.' : 'Письмо отправлено повторно. Проверьте также папку «Спам».', Boolean(error));
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        setMessage('Проверяем данные…');
        const email = String(data.get('email') || '').trim().toLowerCase();
        const password = String(data.get('password') || '');
        if (registerMode && password !== String(data.get('password-confirm') || '')) {
          setMessage('Пароли не совпадают.', true);
          return;
        }
        if (registerMode && (data.get('personal-data-consent') !== 'on' || data.get('trainer-terms') !== 'on')) {
          setMessage('Для регистрации необходимо принять Согласие и Правила.', true);
          return;
        }
        const { data: authData, error } = registerMode
          ? await client.auth.signUp({
              email,
              password,
              options: {
                emailRedirectTo: confirmationRedirect,
                data: {
                  display_name: email.split('@')[0],
                  personal_data_consent: true,
                  consent_version: '1.1',
                  trainer_terms_accepted: true,
                  terms_version: '1.1'
                }
              }
            })
          : await client.auth.signInWithPassword({ email, password });
        if (error) {
          const code = String(error.code || '');
          if (registerMode && ['user_already_exists', 'email_exists'].includes(code)) {
            setMessage('Аккаунт с таким email уже существует. Подтвердите email из письма или восстановите пароль.', true);
            resendConfirmation.hidden = false;
          } else if (!registerMode && code === 'email_not_confirmed') {
            setMessage('Аккаунт создан, но email ещё не подтверждён. Откройте письмо или отправьте его повторно.', true);
            resendConfirmation.hidden = false;
          } else if (!registerMode && code === 'invalid_credentials') {
            setMessage('Email или пароль не подошли. Если аккаунт новый, сначала подтвердите email из письма.', true);
          } else {
            setMessage(registerMode ? 'Регистрация не выполнена. Попробуйте ещё раз позднее.' : 'Не удалось войти. Попробуйте ещё раз или восстановите пароль.', true);
          }
          return;
        }
        if (registerMode && !authData.session) {
          setMessage('Аккаунт создан. Мы отправили письмо: подтвердите email, затем войдите.');
          form.reset();
          emailInput.value = email;
          resendConfirmation.hidden = false;
          return;
        }
        setMessage('Вход выполнен. Открываем тренажёр…');
        const { data: profile } = await client.from('profiles').select('role').eq('id', authData.user.id).single();
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.href = profile?.role === 'admin' && (next === 'admin.html' || !next) ? './admin.html' : './index.html';
      });
    })();
  </script>
  <script src="./legal/legal-footer.js" data-legal-footer></script>
</body>
</html>
