<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новый пароль — ОГЭ-тренажёр</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="study.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="studio-page auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Новый пароль</h1>
      <p class="auth-lead">Придумайте новый пароль для кабинета.</p>
      <form id="reset-form" class="auth-form">
        <label>Новый пароль<input name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="Не менее 6 символов"></label>
        <label>Повторите пароль<input name="password-confirm" type="password" autocomplete="new-password" required minlength="6" placeholder="Повторите пароль"></label>
        <button class="auth-submit" type="submit">Сохранить пароль</button>
        <p id="auth-message" class="auth-message" role="status">Проверяем ссылку…</p>
      </form>
      <a class="auth-back" href="./login.html">Вернуться ко входу</a>
    </section>
  </main>
  <script src="./supabase-config.js"></script>
  <script src="/study/vendor/supabase-js-2.115.0/supabase.js"></script>
  <script>
    (() => {
      const client = window.supabase.createClient(window.OGE_SUPABASE.url, window.OGE_SUPABASE.publishableKey);
      const form = document.querySelector('#reset-form');
      const message = document.querySelector('#auth-message');
      let recoveryReady = false;
      const setMessage = (text, isError = false) => {
        message.textContent = text;
        message.className = `auth-message${isError ? ' is-error' : ''}`;
      };
      client.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || session) {
          recoveryReady = true;
          setMessage('Ссылка подтверждена. Введите новый пароль.');
        }
      });
      client.auth.getSession().then(({ data }) => {
        if (data.session) {
          recoveryReady = true;
          setMessage('Ссылка подтверждена. Введите новый пароль.');
        } else {
          setTimeout(() => { if (!recoveryReady) setMessage('Ссылка недействительна или устарела. Запросите новое письмо на странице входа.', true); }, 1200);
        }
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const password = String(data.get('password') || '');
        if (password !== String(data.get('password-confirm') || '')) {
          setMessage('Пароли не совпадают.', true);
          return;
        }
        if (!recoveryReady) {
          setMessage('Сначала откройте действующую ссылку из письма.', true);
          return;
        }
        setMessage('Сохраняем новый пароль…');
        const { error } = await client.auth.updateUser({ password });
        if (error) {
          setMessage('Не удалось изменить пароль. Запросите новое письмо и повторите попытку.', true);
          return;
        }
        await client.auth.signOut();
        setMessage('Пароль изменён. Теперь войдите с новым паролем.');
        setTimeout(() => { window.location.href = './login.html'; }, 1200);
      });
    })();
  </script>
  <script src="./legal/legal-footer.js" data-legal-footer></script>
</body>
</html>
