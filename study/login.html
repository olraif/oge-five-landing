<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — кабинет ученика</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="study.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="studio-page auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-title">
      <a class="studio-logo auth-logo" href="./choose.html"><span>5</span><strong>Кабинет ученика</strong></a>
      <p class="eyebrow"><span></span> студия ОГЭ</p>
      <h1 id="auth-title">Войти в кабинет</h1>
      <p class="auth-lead">Введите email и пароль, которые вы получили при регистрации.</p>
      <form id="auth-form" class="auth-form">
        <label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Пароль<input name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Не менее 6 символов"></label>
        <button class="auth-submit" type="submit">Войти</button>
        <p id="auth-message" class="auth-message" role="status"></p>
      </form>
      <a class="auth-back" href="./choose.html">Выбрать предмет</a>
    </section>
  </main>
  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const form = document.querySelector('#auth-form');
      const message = document.querySelector('#auth-message');
      const client = window.supabase.createClient(window.OGE_SUPABASE.url, window.OGE_SUPABASE.publishableKey);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        message.textContent = 'Проверяем данные…';
        message.className = 'auth-message';
        const { error } = await client.auth.signInWithPassword({ email: data.get('email'), password: data.get('password') });
        if (error) {
          message.textContent = 'Не удалось войти. Проверьте email и пароль.';
          message.classList.add('is-error');
          return;
        }
        message.textContent = 'Вход выполнен. Открываем кабинет…';
        window.location.href = './index.html';
      });
    })();
  </script>
</body>
</html>
