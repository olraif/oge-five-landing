<!doctype html>
<html lang="ru">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Администратор — ОГЭ-тренажёр</title>
  <link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-extra.css">
</head>
<body class="studio-page admin-page">
  <main class="admin-shell">
    <header class="admin-head">
      <div><p class="eyebrow"><span></span> управление тренажёром</p><h1>ОГЭ-тренажёр</h1><p>Курсы, ученики и доступы в одном месте.</p></div>
      <div class="admin-actions"><a class="admin-button secondary" href="./choose.html">Открыть тренажёр</a><button class="admin-button" id="logout" type="button">Выйти</button></div>
    </header>
    <section class="admin-grid" aria-label="Статистика"><article class="admin-stat"><small>Ученики</small><strong id="students-count">—</strong></article><article class="admin-stat"><small>Курсы</small><strong id="courses-count">—</strong></article><article class="admin-stat"><small>Активные промокоды</small><strong id="coupons-count">—</strong></article></section>
    <section class="admin-panel"><h2>Промокоды</h2><form class="admin-form" id="coupon-form"><label>Код<input name="code" placeholder="MATH-4900"></label><label>Курс<select name="course_id" id="course-select"></select></label><label>Использований<input name="max_uses" type="number" min="1" value="1"></label><button class="admin-button" type="submit">Создать</button></form><p class="admin-message" id="coupon-message"></p><div id="coupons-list" class="admin-empty">Загрузка…</div></section>
    <section class="admin-panel"><div class="admin-panel-head"><h2>Аккаунты учеников</h2><button class="admin-button secondary" id="download-students" type="button" disabled>Скачать CSV</button></div><p class="admin-message" id="account-message"></p><div id="students-list" class="admin-empty">Загрузка…</div></section>
  </main>
  <script src="./supabase-config.js"></script><script src="/study/vendor/supabase-js-2.115.0/supabase.js"></script>
  <script>
    (() => {
      const client = window.supabase.createClient(window.OGE_SUPABASE.url, window.OGE_SUPABASE.publishableKey);
      const $ = (id) => document.getElementById(id);
      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
      const renderTable = (rows, columns) => !rows.length ? '<p class="admin-empty">Пока нет данных.</p>' : `<table class="admin-table"><thead><tr>${columns.map((c) => `<th>${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${columns.map((c) => `<td>${c.render ? c.render(row) : esc(row[c.key])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      let exportedStudents = [];
      const formatDate = (value) => value ? new Date(value).toLocaleString('ru-RU') : '—';
      const csvCell = (value) => {
        let safe = String(value ?? '');
        if (/^\s*[=+\-@]/.test(safe)) safe = `'${safe}`;
        return '"' + safe.replace(/"/g, '""') + '"';
      };
      async function getAllAccounts() {
        const accounts = [];
        const pageSize = 500;
        for (let start = 0; ; start += pageSize) {
          const { data, error } = await client.rpc('admin_list_accounts').range(start, start + pageSize - 1);
          if (error) throw error;
          accounts.push(...(data || []));
          if (!data || data.length < pageSize) return accounts;
        }
      }
      async function getAllAccess() {
        const access = [];
        const pageSize = 500;
        for (let start = 0; ; start += pageSize) {
          const { data, error } = await client.rpc('admin_list_access').range(start, start + pageSize - 1);
          if (error) throw error;
          access.push(...(data || []));
          if (!data || data.length < pageSize) return access;
        }
      }
      function downloadStudents() {
        const rows = [
          ['Email', 'Имя', 'Email подтверждён', 'Создан', 'Курс', 'Промокод', 'Промокод активирован', 'Доступ до', 'Статус'],
          ...exportedStudents.map(({ account, access }) => [account.email, account.display_name, account.email_confirmed ? 'Да' : 'Нет', account.created_at, access?.course_title || '', access?.coupon_code || '', access?.activated_at || '', access?.expires_at || '', access ? (access.is_active ? 'Действует' : 'Истёк') : 'Нет доступа'])
        ];
        const csv = '\uFEFF' + rows.map((row) => row.map(csvCell).join(';')).join('\r\n') + '\r\n';
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = `oge-students-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      async function load() {
        const { data: sessionData } = await client.auth.getSession();
        if (!sessionData.session) { location.href = './login.html?next=admin.html'; return; }
        const { data: profile, error: profileError } = await client.from('profiles').select('role,display_name').eq('id', sessionData.session.user.id).single();
        if (profileError || profile?.role !== 'admin') { document.body.innerHTML = '<main class="admin-shell"><section class="admin-panel"><h2>Доступ закрыт</h2><p class="admin-empty">Этот раздел доступен только администратору.</p><a class="admin-button" href="./choose.html">Вернуться в тренажёр</a></section></main>'; return; }
        const [accountsResult, accessResult, { data: courses }, { data: coupons }] = await Promise.all([
          getAllAccounts().then((data) => ({ data })).catch((error) => ({ error })),
          getAllAccess().then((data) => ({ data })).catch((error) => ({ error })),
          client.from('courses').select('id,title,subject').order('sort_order'),
          client.from('coupons').select('code,course_id,used_count,max_uses,is_active').order('created_at', { ascending:false })
        ]);
        const { data: accounts, error: accountsError } = accountsResult;
        const { data: access, error: accessError } = accessResult;
        const students = (accounts || []).filter((account) => account.account_role !== 'admin');
        const accessByUser = new Map();
        (access || []).forEach((item) => accessByUser.set(item.user_id, [...(accessByUser.get(item.user_id) || []), item]));
        const studentRows = students.flatMap((account) => (accessByUser.get(account.user_id) || [null]).map((item) => ({ account, access: item })));
        exportedStudents = accountsError || accessError ? [] : studentRows;
        $('download-students').disabled = Boolean(accountsError || accessError);
        $('students-count').textContent = accountsError ? '—' : students.length; $('courses-count').textContent = courses?.length || 0; $('coupons-count').textContent = (coupons || []).filter((c) => c.is_active).length;
        if (accountsError) {
          $('students-list').innerHTML = '<p class="admin-empty">Не удалось загрузить аккаунты.</p>';
        } else {
          if (accessError) {
            $('account-message').textContent = 'Аккаунты загружены, но данные о промокодах и сроках доступа недоступны.';
            $('account-message').className = 'admin-message is-error';
          }
          $('students-list').innerHTML = renderTable(studentRows, [
            {label:'Email',render:(r)=>esc(r.account.email)},
            {label:'Имя',render:(r)=>esc(r.account.display_name)},
            {label:'Email подтверждён',render:(r)=>r.account.email_confirmed ? 'Да' : 'Нет'},
            {label:'Создан',render:(r)=>esc(formatDate(r.account.created_at))},
            {label:'Курс',render:(r)=>esc(r.access?.course_title || '—')},
            {label:'Промокод',render:(r)=>esc(r.access?.coupon_code || '—')},
            {label:'Активирован',render:(r)=>esc(formatDate(r.access?.activated_at))},
            {label:'Доступ до',render:(r)=>esc(formatDate(r.access?.expires_at))},
            {label:'Статус',render:(r)=>r.access ? (r.access.is_active ? 'Действует' : 'Истёк') : 'Нет доступа'},
            {label:'',render:(r)=>`<button class="admin-delete" type="button" data-delete-account="${esc(r.account.user_id)}" data-account-email="${esc(r.account.email)}">Удалить</button>`}
          ]);
          document.querySelectorAll('[data-delete-account]').forEach((button) => button.addEventListener('click', async () => {
            const email = button.dataset.accountEmail;
            if (!window.confirm(`Удалить аккаунт ${email} вместе с прогрессом и доступами?`)) return;
            const msg = $('account-message');
            const { data: deleted, error } = await client.rpc('admin_delete_account', { p_user_id: button.dataset.deleteAccount });
            if (error || !deleted) {
              msg.textContent = 'Не удалось удалить аккаунт.';
              msg.className = 'admin-message is-error';
              return;
            }
            msg.textContent = `Аккаунт ${email} удалён.`;
            msg.className = 'admin-message';
            load();
          }));
        }
        $('coupons-list').innerHTML = renderTable(coupons || [], [{label:'Код',key:'code'},{label:'Курс',render:(r)=>esc((courses || []).find((c)=>c.id===r.course_id)?.title || r.course_id)},{label:'Использован',render:(r)=>esc(`${r.used_count}/${r.max_uses}`)},{label:'',render:(r)=>`<button class="admin-delete" type="button" data-delete-code="${esc(r.code)}">Удалить</button>`}]);
        document.querySelectorAll('[data-delete-code]').forEach((button) => button.addEventListener('click', async () => { const code=button.dataset.deleteCode; if(!window.confirm(`Удалить промокод ${code}?`)) return; const { error }=await client.from('coupons').delete().eq('code', code); if(error){$('coupon-message').textContent=`Не удалось удалить: ${error.message}`;$('coupon-message').className='admin-message is-error';return;} load(); }));
        $('course-select').innerHTML = (courses || []).map((c) => `<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('');
        $('course-select').value = courses?.[0]?.id || '';
      }
      $('coupon-form').addEventListener('submit', async (event) => { event.preventDefault(); const data = new FormData(event.currentTarget); const code=String(data.get('code') || '').trim().toUpperCase(); const courseId=String(data.get('course_id') || ''); const maxUses=Number(data.get('max_uses') || 0); const msg=$('coupon-message'); if(!code || !courseId || maxUses < 1) { msg.textContent='Заполните код, курс и количество использований'; msg.className='admin-message is-error'; return; } const { error } = await client.from('coupons').insert({ code, course_id:courseId, max_uses:maxUses }); msg.textContent=error ? `Не удалось создать: ${error.message}` : 'Промокод создан'; msg.className=`admin-message${error?' is-error':''}`; if(!error){event.currentTarget.reset();load();} });
      $('download-students').addEventListener('click', downloadStudents);
      $('logout').addEventListener('click', async () => { await client.auth.signOut(); location.href='./login.html'; });
      load();
    })();
  </script>
  <script src="./legal/legal-footer.js" data-legal-footer></script>

</body>
</html>
